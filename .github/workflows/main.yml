name: Build A115M Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make gcc-9 g++-9 gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu libncurses5-dev python2

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=aarch64-linux-gnu-gcc-9
          export SUBARCH=arm64
          make a115m_defconfig O=out || make exynos850-a115m_defconfig O=out || make defconfig O=out
          # Desactivar stack protector que rompe con gcc nuevo
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config
          echo "# CONFIG_CC_STACKPROTECTOR is not set" >> out/.config
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc-9 2>&1 | tee build.log
          ls -lh out/arch/arm64/boot/Image || echo "NO SE GENERO IMAGE"

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: A115M-Kernel
          path: |
            out/arch/arm64/boot/Image
            build.log
