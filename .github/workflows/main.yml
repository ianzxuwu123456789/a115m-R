name: Build Kernel A115M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lld llvm python3 libncurses5-dev

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=ian
          export KBUILD_BUILD_HOST=github
          mkdir -p out
          make O=out ARCH=arm64 vendor/a115m_defconfig
          make -j$(nproc) O=out ARCH=arm64 \
            KCFLAGS="-Wno-unknown-warning-option -Wno-error" \
            HOSTCFLAGS="-Wno-unknown-warning-option" \
            Image dtbo.img 2>&1 | tee build.log

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: A115M-Kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            build.log
